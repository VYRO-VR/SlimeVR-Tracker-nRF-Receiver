on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  create:
  workflow_dispatch:

concurrency:
  group: ${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

permissions: write-all

env:
  ZEPHYR_SDK_VERSION: "0.17.4"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      sdk-hash: ${{ steps.generate-vars.outputs.sdk-hash }}
      sdk-revision: ${{ steps.generate-vars.outputs.sdk-revision }}
      repo: ${{ steps.generate-vars.outputs.repo }}
      repo-url: ${{ steps.generate-vars.outputs.repo-url }}
      branch: ${{ steps.generate-vars.outputs.branch }}
      repo-hash: ${{ steps.generate-vars.outputs.repo-hash }}
    steps:
      - name: 💻 Checkout Repository
        uses: actions/checkout@v6
        with:
          path: zephyr-workspace/SlimeNRF-CI
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 📟 Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: 📟 Generate CI Variables
        id: generate-vars
        run: |
          WEST_FILE="west.yml"

          if [ -f "$WEST_FILE" ]; then
            echo "Found west.yml in the root directory"
          elif [ -f "zephyr-workspace/$WEST_FILE" ]; then
            WEST_FILE="zephyr-workspace/$WEST_FILE"
            echo "Found west.yml in zephyr-workspace"
          elif [ -f "zephyr-workspace/SlimeNRF-CI/$WEST_FILE" ]; then
            WEST_FILE="zephyr-workspace/SlimeNRF-CI/$WEST_FILE"
            echo "Found west.yml in zephyr-workspace/SlimeNRF-CI"
          else
            echo "Error: west.yml not found!" >&2
            exit 1
          fi

          SDK_URL=$(yq -r '.manifest.projects[] | select(.name=="sdk-nrf") | .url' "$WEST_FILE")
          SDK_REVISION=$(yq -r '.manifest.projects[] | select(.name=="sdk-nrf") | .revision' "$WEST_FILE")
          SDK_COMMIT=$(git ls-remote "$SDK_URL" "$SDK_REVISION" | awk '{print $1}')

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REPO="${{ github.event.pull_request.head.repo.full_name }}"
            REPO_URL="${{ github.event.pull_request.head.repo.clone_url }}"
            BRANCH="${{ github.event.pull_request.head.ref }}"
            REPO_COMMIT="${{ github.event.pull_request.head.sha }}"
          else
            REPO="$GITHUB_REPOSITORY"
            REPO_URL="https://github.com/$GITHUB_REPOSITORY.git"
            BRANCH="${GITHUB_REF#refs/heads/}"
            REPO_COMMIT="$GITHUB_SHA"
          fi

          echo "sdk-hash=$SDK_COMMIT" >> "$GITHUB_OUTPUT"
          echo "sdk-revision=$SDK_REVISION" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "repo-url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "repo-hash=$REPO_COMMIT" >> "$GITHUB_OUTPUT"

      - name: 🧰 Cache + Install Apt Dependencies
        id: cache-apt
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >-
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler wget
            python3-dev python3-pip python3-setuptools python3-tk python3-wheel python3-venv
            xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1
          version: 1.0

      - name: 📦 Cache Zephyr SDK
        id: cache-sdk
        uses: actions/cache@v5
        with:
          path: ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          key: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}

      - name: 🪁 Install Zephyr SDK
        id: install-sdk
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${{ env.ZEPHYR_SDK_VERSION }}/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}_linux-x86_64_minimal.tar.xz -C ~/
          ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}/setup.sh -c -t arm-zephyr-eabi

      - name: 📦 Cache West Workspace
        id: cache-west
        uses: actions/cache@v5
        with:
          path: |
            zephyr-workspace/.west
            zephyr-workspace/zephyr
            zephyr-workspace/nrf
            zephyr-workspace/modules
            zephyr-workspace/nrfxlib
            zephyr-workspace/bootloader
            zephyr-workspace/tools
          key: west-workspace-${{ steps.generate-vars.outputs.sdk-hash }}

      - name: 📦 Cache PIP Requirements
        id: cache-pip
        uses: actions/cache@v5
        with:
          path: ~/.venv
          key: venv-pip-${{ env.ZEPHYR_SDK_VERSION }}

      - name: 📦 Restore Python venv
        if: steps.cache-pip.outputs.cache-hit != 'true'
        id: restore-venv
        uses: actions/cache/restore@v5
        with:
          path: ~/.venv
          key: venv-${{ env.ZEPHYR_SDK_VERSION }}

      - name: 🐍 Setup Python venv + West
        id: setup-venv
        if: ${{ steps.cache-pip.outputs.cache-hit != 'true' && steps.restore-venv.outputs.cache-hit != 'true' }}
        run: |
          python3 -m venv ~/.venv
          ~/.venv/bin/pip install west ninja

      - name: 📦 Cache Python venv
        if: steps.restore-venv.outputs.cache-hit != 'true'
        id: cache-venv
        uses: actions/cache/save@v5
        with:
          path: ~/.venv
          key: venv-${{ env.ZEPHYR_SDK_VERSION }}

      - name: ♻️ Initialize Zephyr Workspace
        id: init-west
        run: |
          echo "$HOME/.venv/bin" >> $GITHUB_PATH
          export PATH="$HOME/.venv/bin:$PATH"
          cd zephyr-workspace
          if [ ! -d ".west" ]; then
            west init -l SlimeNRF-CI
          fi
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: 🐍 Install Zephyr Python Requirements
        id: install-pip
        if: steps.cache-pip.outputs.cache-hit != 'true'
        run: |
          cd zephyr-workspace
          ~/.venv/bin/pip install -r zephyr/scripts/requirements.txt

      - name: 📦 Cache Repository
        id: cache-repository
        uses: actions/cache@v5
        with:
          path: zephyr-workspace/SlimeVR-Tracker-nRF-Receiver
          key: firmware-${{ steps.generate-vars.outputs.repo-hash }}

      - name: 📥 Clone Repository
        id: clone-repository
        if: steps.cache-repository.outputs.cache-hit != 'true'
        run: |
          cd zephyr-workspace
          rm -rf SlimeVR-Tracker-nRF-Receiver

          git clone --filter=blob:none --no-checkout "${{ steps.generate-vars.outputs.repo-url }}" SlimeVR-Tracker-nRF-Receiver
          git -C SlimeVR-Tracker-nRF-Receiver fetch origin "${{ steps.generate-vars.outputs.branch }}"
          git -C SlimeVR-Tracker-nRF-Receiver checkout "${{ steps.generate-vars.outputs.repo-hash }}"
          git -C SlimeVR-Tracker-nRF-Receiver submodule update --init --recursive --depth 1

  build:
    needs: setup
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        boards: [
                  {boardname: "nrf52840dongle/nrf52840", filename: "SlimeNRF_Nordic_eByte_Dongle_Receiver"},
                  {boardname: "nrf52840dongle/nrf52840", filename: "SlimeNRF_Nordic_eByte_Dongle_Receiver_DataCollect_CDC", with_data_collect_cdc: true},
                  {boardname: "holyiot_21017/nrf52840", filename: "SlimeNRF_Holyiot_Dongle_Receiver"},
                  {boardname: "holyiot_21017/nrf52840", filename: "SlimeNRF_Holyiot_Dongle_Receiver_DataCollect_CDC", with_data_collect_cdc: true},
                  {boardname: "holyiot_22046/nrf52840", filename: "SlimeNRF_Holyiot_22046_Dongle_Receiver"},
                  {boardname: "holyiot_22046/nrf52840", filename: "SlimeNRF_Holyiot_22046_Dongle_Receiver_DataCollect_CDC", with_data_collect_cdc: true},
                  {boardname: "promicro_uf2/nrf52840", filename: "SlimeNRF_ProMicro_Receiver"},
                  {boardname: "promicro_uf2/nrf52840", filename: "SlimeNRF_ProMicro_Receiver_DataCollect_CDC", with_data_collect_cdc: true},
                  {boardname: "xiao_ble/nrf52840", filename: "SlimeNRF_XIAO_Receiver"},
                  {boardname: "xiao_ble/nrf52840", filename: "SlimeNRF_XIAO_Receiver_DataCollect_CDC", with_data_collect_cdc: true},
                  {boardname: "etee_dongle_uf2/nrf52840", filename: "SlimeNRF_etee_Receiver"},
                  {boardname: "etee_dongle_uf2/nrf52840", filename: "SlimeNRF_etee_Receiver_DataCollect_CDC", with_data_collect_cdc: true},
                  {boardname: "nrf52840dk/nrf52840", filename: "SlimeNRF_nRF52840dk_Receiver"},
                  {boardname: "nrf52840dk/nrf52840", filename: "SlimeNRF_nRF52840dk_Receiver_DataCollect_CDC", with_data_collect_cdc: true},
                  {boardname: "styria_r1_uf2/nrf52840", filename: "SlimeNRF_Styria_R1_Receiver"},
                  {boardname: "styria_r1_uf2/nrf52840", filename: "SlimeNRF_Styria_R1_Receiver_DataCollect_CDC", with_data_collect_cdc: true},
                  {boardname: "aerorx_r1_uf2/nrf52840", filename: "SlimeNRF_AeroRX_R1_Receiver"},
                  {boardname: "aerorx_r1_uf2/nrf52840", filename: "SlimeNRF_AeroRX_R1_Receiver_DataCollect_CDC", with_data_collect_cdc: true},
                  {boardname: "nekonya_uf2/nrf52833", filename: "SlimeNRF_NekoNya_Receiver"},
                  {boardname: "foxdongle33_uf2/nrf52833", filename: "SlimeNRF_FoxDongle33_Receiver"},
                  {boardname: "foxdongle33_uf2/nrf52833", filename: "SlimeNRF_FoxDongle33_Receiver_DataCollect_CDC", with_data_collect_cdc: true},
                  {boardname: "foxdongle_uf2/nrf52840", filename: "SlimeNRF_FoxDongle_Receiver"},
                  {boardname: "foxdongle_uf2/nrf52840", filename: "SlimeNRF_FoxDongle_Receiver_DataCollect_CDC", with_data_collect_cdc: true},
                  {boardname: "foxpromicro_rfek_uf2/nrf52840", filename: "SlimeNRF_FoxProMicro_RFEK_Receiver"},
                  {boardname: "foxpromicro_rfek_uf2/nrf52840", filename: "SlimeNRF_FoxProMicro_RFEK_Receiver_DataCollect_CDC", with_data_collect_cdc: true},
                ]
    runs-on: ubuntu-latest
    steps:
      - name: 💻 Checkout Repository
        uses: actions/checkout@v6
        with:
          path: zephyr-workspace/SlimeNRF-CI
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 🧰 Cache + Install Apt Dependencies
        id: restore-apt
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >-
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler wget
            python3-dev python3-pip python3-setuptools python3-tk python3-wheel python3-venv
            xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1
          version: 1.0

      - name: 📦 Restore Zephyr SDK
        id: restore-sdk
        uses: actions/cache/restore@v5
        with:
          path: ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          key: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          fail-on-cache-miss: true

      - name: 🪁 Register Zephyr SDK
        id: register-sdk
        run: |
          ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}/setup.sh -c -t arm-zephyr-eabi

      - name: 📦 Restore West Workspace
        id: restore-west
        uses: actions/cache/restore@v5
        with:
          path: |
            zephyr-workspace/.west
            zephyr-workspace/zephyr
            zephyr-workspace/nrf
            zephyr-workspace/modules
            zephyr-workspace/nrfxlib
            zephyr-workspace/bootloader
            zephyr-workspace/tools
          key: west-workspace-${{ needs.setup.outputs.sdk-hash }}
          fail-on-cache-miss: true

      - name: 📦 Restore PIP Requirements
        id: restore-pip
        uses: actions/cache/restore@v5
        with:
          path: ~/.venv
          key: venv-pip-${{ env.ZEPHYR_SDK_VERSION }}
          fail-on-cache-miss: true

      - name: ♻️ Register Zephyr Workspace
        id: register-west
        run: |
          echo "$HOME/.venv/bin" >> $GITHUB_PATH
          export PATH="$HOME/.venv/bin:$PATH"
          cd zephyr-workspace
          west zephyr-export

      - name: 📦 Restore Repository
        id: restore-repository
        uses: actions/cache/restore@v5
        with:
          path: zephyr-workspace/SlimeVR-Tracker-nRF-Receiver
          key: firmware-${{ needs.setup.outputs.repo-hash }}
          fail-on-cache-miss: true

      - name: 🔨 Build SlimeVR-Tracker-nRF-Receiver - ${{ matrix.boards.boardname }}
        id: build-firmware
        run: |
          cd zephyr-workspace
          sudo rm -rf Releases
          mkdir -p Releases
          REPO_DIR="${{ github.event.repository.name }}"
          if [ ! -d "$REPO_DIR" ]; then
            echo "Repo dir not found: $REPO_DIR; fallback to SlimeNRF-CI"
            REPO_DIR="SlimeNRF-CI"
          fi
          EXTRA_CMAKE_ARGS=()
          if [ "${{ matrix.boards.with_data_collect_cdc }}" = "true" ]; then
            EXTRA_CMAKE_ARGS+=(
              -DEXTRA_CONF_FILE=boards/data_collect_cdc.conf
              -DEXTRA_DTC_OVERLAY_FILE=boards/data_collect_cdc.overlay
            )
          fi
          rm -rf "$REPO_DIR/build"
          west build \
              --board ${{ matrix.boards.boardname }} \
              --pristine=always "$REPO_DIR" \
              --build-dir "$REPO_DIR/build" \
              -- \
              -DNCS_TOOLCHAIN_VERSION=NONE \
              -DBOARD_ROOT=../"$REPO_DIR" \
              "${EXTRA_CMAKE_ARGS[@]}"

          for ext in uf2 hex; do
            src="$REPO_DIR/build/$REPO_DIR/zephyr/zephyr.${ext}"
            dst="Releases/${{ matrix.boards.filename }}.${ext}"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
              echo "Saved: $dst"
            else
              echo "Not found (skip): $src"
            fi
          done


      - name: 🧰 Install ARM bare-metal toolchain (FoxDongle combined hex)
        id: install-arm-toolchain
        if: ${{ matrix.boards.filename == 'SlimeNRF_FoxDongle_Receiver' }}
        run: |
          # Plain apt-get (not the apt cache action) so the newlib C headers/libs
          # that live in transitive deps (e.g. libnewlib-dev, which owns the target
          # string.h) are pulled in. The cache action only captures named packages.
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1

      - name: 🥾 Build FoxDongle Bootloader (foxdongle_nrf52840, no SoftDevice)
        id: build-bootloader
        if: ${{ matrix.boards.filename == 'SlimeNRF_FoxDongle_Receiver' }}
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf fox-bootloader
          # KenRouKoro's Adafruit_nRF52_Bootloader fork carries the
          # foxdongle_nrf52840 board (UF2 volume "FOX-BOOT" — the bootloader the
          # real dongles ship with). Pin to a specific commit (blobless clone +
          # checkout) for reproducibility.
          BL_SHA=95e85f15c1969735b930e29dfdb8df2748064ef4
          git clone --filter=blob:none --no-checkout \
            https://github.com/KenRouKoro/Adafruit_nRF52_Bootloader.git fox-bootloader
          cd fox-bootloader
          git checkout "$BL_SHA"
          git submodule update --init --depth 1
          # `make all` would also build a DFU .zip (needs adafruit-nrfutil) and an
          # SD-merged hex we don't need (the app loads at 0x1000 — no SoftDevice).
          # Build only the no-SoftDevice image (MBR + bootloader) via a second
          # makefile read AFTER the main Makefile, so $(BUILD)/$(OUT_NAME) are
          # defined (a command-line --eval runs before the Makefile, when they are
          # still empty). GIT_VERSION is overridden because git-describe on a
          # pinned, tagless commit returns a bare SHA that the Makefile's version
          # math cannot parse.
          printf 'nosd_only: $(BUILD)/$(OUT_NAME)_nosd.hex\n' > nosd_only.mk
          make -f Makefile -f nosd_only.mk \
            BOARD=foxdongle_nrf52840 MCU_SUB_VARIANT=nrf52840 \
            GIT_VERSION=0.9.2-fox-g95e85f1 nosd_only
          echo "Bootloader output:"
          ls -la _build/build-foxdongle_nrf52840/*_nosd.hex

      - name: 🔗 Merge FoxDongle Bootloader + Application into single hex
        id: merge-hex
        if: ${{ matrix.boards.filename == 'SlimeNRF_FoxDongle_Receiver' && steps.build-firmware.outcome == 'success' }}
        run: |
          cd zephyr-workspace
          REPO_DIR="${{ github.event.repository.name }}"
          if [ ! -d "$REPO_DIR" ]; then
            REPO_DIR="SlimeNRF-CI"
          fi
          mkdir -p Releases
          BL=$(ls "$GITHUB_WORKSPACE"/fox-bootloader/_build/build-foxdongle_nrf52840/*_nosd.hex | head -1)
          APP="$REPO_DIR/build/$REPO_DIR/zephyr/zephyr.hex"
          echo "Bootloader hex: $BL"
          echo "Application hex: $APP"
          # The Adafruit (SDK11) bootloader only launches the app when its
          # settings page (0xFF000 on nRF52840) flags bank_0 == BANK_VALID_APP.
          # That flag is written by the UF2/DFU update flow, NOT by a raw J-Link
          # flash, so a plain bootloader+app merge boots into DFU (UF2 drive)
          # instead of the app. Generate a settings page marking the app valid.
          # bank_0_crc=0 tells the bootloader to skip the CRC check (treated as
          # valid), matching its own "stored crc of 0 == CRC checking not used"
          # behaviour.
          python3 -c "import struct; from intelhex import IntelHex; d=struct.pack('<HHH2x5I',1,0,0,0,0,0,0,0); ih=IntelHex(); ih.frombytes(d,offset=0xFF000); ih.write_hex_file('bl_settings.hex')"
          # mergehex.py ships with the Zephyr workspace; python3 here resolves to
          # the Zephyr venv (intelhex available). App (0x1000), bootloader/MBR/
          # UICR (0xF4000+), and the settings page (0xFF000) do not overlap;
          # --overlap=replace matches the merge convention used elsewhere.
          python3 zephyr/scripts/build/mergehex.py --overlap=replace \
            -o "Releases/${{ matrix.boards.filename }}_Combined.hex" "$BL" "$APP" bl_settings.hex
          echo "Combined hex:"
          ls -la "Releases/${{ matrix.boards.filename }}_Combined.hex"

      - name: 💾 Upload Artifact - ${{ matrix.boards.boardname }}
        id: upload-artifact
        if: ${{ steps.build-firmware.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.boards.filename }}
          if-no-files-found: warn
          path: |
            zephyr-workspace/Releases/${{ matrix.boards.filename }}.uf2
            zephyr-workspace/Releases/${{ matrix.boards.filename }}.hex
            zephyr-workspace/Releases/${{ matrix.boards.filename }}_Combined.hex
